name = "docgen-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Publish to https://<name>.<your-subdomain>.workers.dev.
# Declaring it here means `wrangler deploy` enables the route itself. Without
# it, a Worker first deployed before the account had a workers.dev subdomain
# stays permanently unrouted ("No URLs enabled") even after the subdomain is
# registered, because nothing ever turns the route on.
workers_dev = true

[vars]
# Comma-separated list of exact origins allowed to call this Worker.
# Origin means scheme + host only, with no path and no trailing slash.
# GitHub Pages project sites are served from the account origin, so
# https://ad-pp.github.io/kyc_doc_generator_ocr_prefill/ has the origin below.
ALLOWED_ORIGINS = "https://ad-pp.github.io"
GEMINI_MODEL = "gemini-3.7-flash"
# Fallback model, reached only when Gemini fails. OpenRouter fronts many
# models behind one endpoint, so changing this line changes the fallback —
# no code change. Must be a model that accepts images/PDFs.
# Check current free models and their limits at https://openrouter.ai/models
OPENROUTER_MODEL = "google/gemma-4-31b-it:free"
# Parser used for PDF inputs on OpenRouter. "pdf-text" suits digital PDFs;
# switch to an OCR engine for scanned ones (see OpenRouter's file-parser docs).
OPENROUTER_PDF_ENGINE = "pdf-text"
# Last-resort tier, images only — Groq's vision models do not take PDFs.
# Must be a vision-capable model: https://console.groq.com/docs/models
# If the account has no vision model, leave GROQ_API_KEY unset and the tier is
# skipped; `node tools/check-providers.mjs` reports which models are available.
GROQ_MODEL = "meta-llama/llama-4-scout-17b-16e-instruct"

DAILY_LIMIT_PER_AGENT = "40"
DAILY_LIMIT_PER_IP = "120"

# Quota counters and the central usage log.
# Create the namespace, then uncomment this block and paste in the id:
#   npx wrangler kv namespace create USAGE
# Without it the Worker still extracts documents; it just cannot enforce
# per-day caps or keep a central log.
[[kv_namespaces]]
binding = "USAGE"
id = "f67d5be25eaa46ce95c79df3c3959b93"

# Secrets are NOT set here — this file is committed. Set them once, encrypted:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put OPENROUTER_API_KEY
#   npx wrangler secret put GROQ_API_KEY
