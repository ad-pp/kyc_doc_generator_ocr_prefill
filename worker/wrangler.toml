name = "docgen-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Publish to https://<name>.<your-subdomain>.workers.dev.
# Declaring it here means `wrangler deploy` enables the route itself. Without
# it, a Worker first deployed before the account had a workers.dev subdomain
# stays permanently unrouted ("No URLs enabled") even after the subdomain is
# registered, because nothing ever turns the route on.
workers_dev = true

[vars]
# Comma-separated list of exact origins allowed to call this Worker.
# Origin means scheme + host only, with no path and no trailing slash.
# GitHub Pages project sites are served from the account origin, so
# https://ad-pp.github.io/kyc_doc_generator_ocr_prefill/ has the origin below.
ALLOWED_ORIGINS = "https://ad-pp.github.io"
GEMINI_MODEL = "gemini-2.5-flash"
GROQ_MODEL = "llama-3.3-70b-versatile"

# OCR.space tuning — see https://ocr.space/ocrapi#ocrengine
# Engine 3: highest accuracy, tables returned as Markdown, handwriting.
#           Free quota 2,500/month, separate from the Engine 1/2 pool.
# Engine 2: documented all-rounder, strong on noisy photos and rotated text.
#           Shares the free 25,000/month pool with Engine 1.
# The Worker tries OCRSPACE_ENGINE and retries once with the fallback, so
# exhausting the small Engine 3 quota degrades to Engine 2 automatically.
OCRSPACE_ENGINE = "3"
OCRSPACE_ENGINE_FALLBACK = "2"
# "auto" enables language auto-detection on Engines 2/3; the Worker
# substitutes "eng" automatically if a call lands on Engine 1, which has no
# auto mode. Use a 3-letter code (eng, hin, ...) to pin one language.
OCRSPACE_LANGUAGE = "auto"
# Forces line-by-line output. Engine 3 already returns Markdown tables, so
# leave false unless you pin an engine and your deeds are heavily tabular.
OCRSPACE_TABLE = "false"
# Free-plan file size cap is 1 MB. The browser compresses below this first.
OCRSPACE_MAX_KB = "1024"
DAILY_LIMIT_PER_AGENT = "40"
DAILY_LIMIT_PER_IP = "120"

# Quota counters and the central usage log.
# Create the namespace, then uncomment this block and paste in the id:
#   npx wrangler kv namespace create USAGE
# Without it the Worker still extracts documents; it just cannot enforce
# per-day caps or keep a central log.
[[kv_namespaces]]
binding = "USAGE"
id = "f67d5be25eaa46ce95c79df3c3959b93"

# Secrets are NOT set here — this file is committed. Set them once, encrypted:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put OCRSPACE_API_KEY
#   npx wrangler secret put GROQ_API_KEY
