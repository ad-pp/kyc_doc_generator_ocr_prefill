<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<title>Merchant Onboarding Document Generator</title>
<style>
:root{--pe:#5f259f;--pe2:#7b3fc4;--pale:#f3eeff;--gold:#c8962a;--green:#1a7a4a;--red:#c0392b;--bg:#f4f1fa;--card:#fff;--bdr:#ddd4f0;--txt:#1a1230;--muted:#6b5e8a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
header{background:linear-gradient(135deg,#2d0e6e,var(--pe) 55%,#9b50e0);padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(95,37,159,.35);position:sticky;top:0;z-index:50}
.logo{width:38px;height:38px;background:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--pe);flex:0 0 auto}
header h1{color:#fff;font-size:16px;font-weight:700;line-height:1.2}
header p{color:rgba(255,255,255,.75);font-size:11px;margin-top:1px}
.saved{margin-left:auto;background:rgba(255,255,255,.18);color:#fff;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap;flex:0 0 auto}
.wrap{max-width:820px;margin:0 auto;padding:16px 12px 90px}

.progress{display:flex;gap:4px;margin-bottom:16px}
.progress .seg{flex:1;height:5px;border-radius:3px;background:var(--bdr)}
.progress .seg.done{background:var(--green)}
.progress .seg.cur{background:var(--pe)}

.card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 10px rgba(95,37,159,.06)}
.chd{background:linear-gradient(90deg,var(--pe),var(--pe2));padding:11px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chd h2{color:#fff;font-size:13px;font-weight:700}
.badge{background:rgba(255,255,255,.22);color:#fff;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;margin-left:auto}
.cbd{padding:14px}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.s2{grid-column:span 2}
.s3{grid-column:span 3}
@media(max-width:600px){.g2,.g3{grid-template-columns:1fr}.s2,.s3{grid-column:span 1}}

.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.f label .r{color:var(--red)}
.f input,.f select,.f textarea{border:1.5px solid var(--bdr);border-radius:8px;padding:9px 11px;font-size:16px;color:var(--txt);background:#fff;outline:none;width:100%;font-family:inherit}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--pe);box-shadow:0 0 0 3px rgba(95,37,159,.11)}
.f input.err,.f select.err,.f textarea.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(192,57,43,.09)}
.f textarea{resize:vertical;min-height:60px}
.f .hint{font-size:11.5px;color:var(--muted);line-height:1.4}
.err-msg{font-size:11.5px;color:var(--red);font-weight:600}

.rg{display:flex;gap:10px;flex-wrap:wrap}
.rg label{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--txt);cursor:pointer;padding:10px 14px;border:1.5px solid var(--bdr);border-radius:10px;background:#faf8ff;flex:1;min-width:140px;justify-content:center}
.rg label:hover{border-color:var(--pe);background:var(--pale)}
.rg input{width:17px;height:17px;accent-color:var(--pe);cursor:pointer}
.cg label{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:500;color:var(--txt);cursor:pointer}
.cg input{width:17px;height:17px;accent-color:var(--pe);cursor:pointer;flex:0 0 auto;margin-top:1px}

.divider{font-size:11px;font-weight:700;color:var(--pe);text-transform:uppercase;letter-spacing:.8px;padding:10px 0 6px;border-bottom:1px dashed var(--bdr);margin:6px 0 10px}
.info{background:#fff8e1;border-left:4px solid var(--gold);border-radius:0 8px 8px 0;padding:8px 12px;font-size:12.5px;color:#6a4e00;margin-bottom:12px;line-height:1.45}
.info-blue{background:#e8f0fe;border-left:4px solid #4285f4;border-radius:0 8px 8px 0;padding:8px 12px;font-size:12.5px;color:#1a3a7a;margin-bottom:12px;line-height:1.45}
.error-box{background:#fdecea;border-left:4px solid var(--red);border-radius:0 8px 8px 0;padding:10px 12px;font-size:13px;color:var(--red);margin-bottom:12px}
.error-box ul{padding-left:18px;margin-top:5px}

.prow{border:1.5px solid var(--bdr);border-radius:10px;padding:13px;margin-bottom:10px;background:#faf8ff}
.prow.as{border-color:var(--green)}
.prow-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.plbl{font-size:12px;font-weight:700;color:var(--pe);background:var(--pale);padding:3px 10px;border-radius:20px}
.as-label{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;margin-left:auto}
.as-label input{width:16px;height:16px;accent-color:var(--green);cursor:pointer}
.rm-btn{background:none;border:1.5px solid #e0c0c0;border-radius:6px;color:var(--red);font-size:12px;font-weight:600;padding:4px 10px;cursor:pointer}
.add-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--pale);border:2px dashed var(--pe);border-radius:10px;padding:11px;color:var(--pe);font-weight:700;font-size:13.5px;cursor:pointer;width:100%;margin-top:6px}
.p-section{font-size:10.5px;font-weight:700;color:var(--pe);text-transform:uppercase;letter-spacing:.7px;padding:8px 0 6px;border-bottom:1px dashed var(--bdr);margin-bottom:8px}

.aadhar-wrap{display:flex;align-items:center;border:1.5px solid var(--bdr);border-radius:8px;background:#fff;overflow:hidden}
.aadhar-wrap.err{border-color:var(--red)}
.aadhar-prefix{padding:9px 0 9px 11px;font-size:14px;color:var(--muted);white-space:nowrap;background:#f7f4ff;border-right:1px solid var(--bdr)}
.aadhar-input{border:none!important;border-radius:0!important;flex:1;min-width:0;padding:9px 11px!important}

.doc-row{display:flex;align-items:flex-start;gap:12px;background:#fff;border:2px solid var(--bdr);border-radius:12px;padding:13px 15px;margin-bottom:10px;cursor:pointer}
.doc-row.on{border-color:var(--pe);background:var(--pale)}
.doc-row input{width:20px;height:20px;accent-color:var(--pe);flex:0 0 auto;margin-top:1px}
.dc-title{font-size:14px;font-weight:700;color:var(--txt)}
.dc-sub{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}

.act{display:flex;justify-content:space-between;align-items:center;padding:10px 0 6px;gap:10px;flex-wrap:wrap}
.btn{padding:11px 20px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:8px;font-family:inherit;justify-content:center}
.btn-p{background:linear-gradient(135deg,var(--pe),var(--pe2));color:#fff;box-shadow:0 4px 14px rgba(95,37,159,.3)}
.btn-s{background:#fff;color:var(--pe);border:2px solid var(--pe)}
.btn-g{background:linear-gradient(135deg,#1a7a4a,#22a060);color:#fff;box-shadow:0 4px 14px rgba(26,122,74,.28)}
.btn-gold{background:linear-gradient(135deg,#c8962a,#e0ac3d);color:#fff}
.btn-red{background:#fff;color:var(--red);border:2px solid var(--red);font-size:12px;padding:8px 14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-full{width:100%}

.gen-box{background:linear-gradient(135deg,#f0eaff,#eef7f1);border:2px solid var(--pe);border-radius:14px;padding:20px;text-align:center}
.gen-box h3{font-size:16px;color:var(--pe);margin-bottom:6px}
.gen-box p{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.5}
.doc-group{border:1px solid var(--bdr);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
.doc-group h4{font-size:13px;color:var(--txt);margin-bottom:8px}
.doc-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.rtbl{width:100%;border-collapse:collapse;font-size:13px}
.rtbl td{padding:7px 8px;border-bottom:1px solid var(--bdr);vertical-align:top}
.rtbl td:first-child{font-weight:600;color:var(--muted);width:42%}
.rtbl tr.hd td{background:var(--pe);color:#fff;font-weight:700;font-size:11.5px;letter-spacing:.4px}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--txt);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center;z-index:999}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:var(--green)}
#toast.er{background:var(--red)}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="logo">DG</div>
  <div>
    <h1>Onboarding Document Generator</h1>
    <p>Fill once &middot; Generate all documents &middot; Sign &amp; submit</p>
  </div>
  <div class="saved" id="saveLabel">Auto-save ON</div>
</header>
<div class="wrap">
  <div class="progress" id="progressBar"></div>
  <div id="app"></div>
</div>
<div id="toast"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
