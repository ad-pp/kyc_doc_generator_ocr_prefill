<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="robots" content="noindex,nofollow,noarchive" />
<meta name="referrer" content="no-referrer" />
<title>Merchant Onboarding Document Generator</title>
<style>
:root{--pe:#5f259f;--pe2:#7b3fc4;--pale:#f5f0ff;--gold:#b77a12;--green:#16754a;--red:#bd3328;--bg:#f3f4f8;--card:#fff;--bdr:#dedfea;--txt:#171523;--muted:#666579;--shadow:0 10px 30px rgba(35,24,62,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 50% -180px,#e9dcff 0,transparent 420px),var(--bg);color:var(--txt);min-height:100vh}
.app-header{background:#24103e;padding:13px max(18px,calc((100vw - 900px)/2));display:flex;align-items:center;gap:12px;box-shadow:0 4px 18px rgba(31,18,53,.22);position:sticky;top:0;z-index:50}
.logo{width:38px;height:38px;background:linear-gradient(145deg,#fff,#eee7fa);border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--pe);flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.app-header h1{color:#fff;font-size:16px;font-weight:750;line-height:1.2;letter-spacing:-.15px}
.app-header p{color:rgba(255,255,255,.75);font-size:11px;margin-top:1px}
.saved{margin-left:auto;background:rgba(255,255,255,.18);color:#fff;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap;flex:0 0 auto}
.wrap{max-width:900px;margin:0 auto;padding:22px 14px 90px}

.progress{display:flex;gap:4px;margin-bottom:16px}
.progress .seg{flex:1;height:4px;border-radius:3px;background:#d7d7e0}
.progress .seg.done{background:var(--green)}
.progress .seg.cur{background:var(--pe)}

.card{background:rgba(255,255,255,.98);border:1px solid var(--bdr);border-radius:16px;margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow)}
.chd{background:#faf9fc;border-bottom:1px solid var(--bdr);padding:13px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chd h2{color:var(--txt);font-size:14px;font-weight:750}
.badge{background:var(--pale);color:var(--pe);border:1px solid #ded0f2;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;margin-left:auto}
.cbd{padding:17px}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.s2{grid-column:span 2}
.s3{grid-column:span 3}
@media(max-width:600px){.g2,.g3{grid-template-columns:1fr}.s2,.s3{grid-column:span 1}}

.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.f label .r{color:var(--red)}
.f input,.f select,.f textarea{border:1.5px solid var(--bdr);border-radius:8px;padding:9px 11px;font-size:16px;color:var(--txt);background:#fff;outline:none;width:100%;font-family:inherit}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--pe);box-shadow:0 0 0 3px rgba(95,37,159,.11)}
.f input.err,.f select.err,.f textarea.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(192,57,43,.09)}
.f textarea{resize:vertical;min-height:60px}
.f .hint{font-size:11.5px;color:var(--muted);line-height:1.4}
.err-msg{font-size:11.5px;color:var(--red);font-weight:600}

.rg{display:flex;gap:10px;flex-wrap:wrap}
.rg label{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:650;color:var(--txt);cursor:pointer;padding:11px 14px;border:1.5px solid var(--bdr);border-radius:11px;background:#fff;flex:1;min-width:140px;justify-content:center}
.rg label:hover{border-color:var(--pe);background:var(--pale)}
.rg input{width:17px;height:17px;accent-color:var(--pe);cursor:pointer}
.cg label{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:500;color:var(--txt);cursor:pointer}
.cg input{width:17px;height:17px;accent-color:var(--pe);cursor:pointer;flex:0 0 auto;margin-top:1px}

.divider{font-size:11px;font-weight:700;color:var(--pe);text-transform:uppercase;letter-spacing:.8px;padding:10px 0 6px;border-bottom:1px dashed var(--bdr);margin:6px 0 10px}
.info{background:#fff8e1;border-left:4px solid var(--gold);border-radius:0 8px 8px 0;padding:8px 12px;font-size:12.5px;color:#6a4e00;margin-bottom:12px;line-height:1.45}
.info-blue{background:#e8f0fe;border-left:4px solid #4285f4;border-radius:0 8px 8px 0;padding:8px 12px;font-size:12.5px;color:#1a3a7a;margin-bottom:12px;line-height:1.45}
.info-green{background:#ebf8ef;border-left:4px solid #1f8f54;border-radius:0 8px 8px 0;padding:8px 12px;font-size:12.5px;color:#195d38;margin-bottom:12px;line-height:1.45}
.error-box{background:#fdecea;border-left:4px solid var(--red);border-radius:0 8px 8px 0;padding:10px 12px;font-size:13px;color:var(--red);margin-bottom:12px}
.error-box ul{padding-left:18px;margin-top:5px}
.warn-box{background:#fff4df;border-left:4px solid #d18a00;border-radius:0 8px 8px 0;padding:10px 12px;font-size:13px;color:#7d5900;margin-bottom:12px}

.prow{border:1.5px solid var(--bdr);border-radius:10px;padding:13px;margin-bottom:10px;background:#faf8ff}
.prow.as{border-color:var(--green)}
.prow-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.plbl{font-size:12px;font-weight:700;color:var(--pe);background:var(--pale);padding:3px 10px;border-radius:20px}
.as-label{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;margin-left:auto}
.as-label input{width:16px;height:16px;accent-color:var(--green);cursor:pointer}
.rm-btn{background:none;border:1.5px solid #e0c0c0;border-radius:6px;color:var(--red);font-size:12px;font-weight:600;padding:4px 10px;cursor:pointer}
.add-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--pale);border:2px dashed var(--pe);border-radius:10px;padding:11px;color:var(--pe);font-weight:700;font-size:13.5px;cursor:pointer;width:100%;margin-top:6px}
.p-section{font-size:10.5px;font-weight:700;color:var(--pe);text-transform:uppercase;letter-spacing:.7px;padding:8px 0 6px;border-bottom:1px dashed var(--bdr);margin-bottom:8px}

.aadhar-wrap{display:flex;align-items:center;border:1.5px solid var(--bdr);border-radius:8px;background:#fff;overflow:hidden}
.aadhar-wrap.err{border-color:var(--red)}
.aadhar-prefix{padding:9px 0 9px 11px;font-size:14px;color:var(--muted);white-space:nowrap;background:#f7f4ff;border-right:1px solid var(--bdr)}
.aadhar-input{border:none!important;border-radius:0!important;flex:1;min-width:0;padding:9px 11px!important}

.doc-row{display:flex;align-items:flex-start;gap:12px;background:#fff;border:2px solid var(--bdr);border-radius:12px;padding:13px 15px;margin-bottom:10px;cursor:pointer}
.doc-row.on{border-color:var(--pe);background:var(--pale)}
.doc-row input{width:20px;height:20px;accent-color:var(--pe);flex:0 0 auto;margin-top:1px}
.dc-title{font-size:14px;font-weight:700;color:var(--txt)}
.dc-sub{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}

.act{display:flex;justify-content:space-between;align-items:center;padding:10px 0 6px;gap:10px;flex-wrap:wrap}
.btn{padding:11px 19px;border-radius:10px;font-size:13px;font-weight:750;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:8px;font-family:inherit;justify-content:center;transition:transform .15s,box-shadow .15s,background .15s}
.btn:not(:disabled):active{transform:translateY(1px)}
.btn-p{background:linear-gradient(135deg,var(--pe),var(--pe2));color:#fff;box-shadow:0 4px 14px rgba(95,37,159,.3)}
.btn-s{background:#fff;color:var(--pe);border:2px solid var(--pe)}
.btn-g{background:linear-gradient(135deg,#1a7a4a,#22a060);color:#fff;box-shadow:0 4px 14px rgba(26,122,74,.28)}
.btn-gold{background:linear-gradient(135deg,#c8962a,#e0ac3d);color:#fff}
.btn-red{background:#fff;color:var(--red);border:2px solid var(--red);font-size:12px;padding:8px 14px}
.btn-reset{background:#fff;color:#58566a;border:1px solid #c9c8d2}
.btn-danger{background:#fff;color:var(--red);border:1px solid #dfb4b1}
.reset-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.reset-link{margin-left:auto;background:none;border:0;color:var(--pe);font:inherit;font-size:11px;font-weight:700;cursor:pointer;text-decoration:underline}
.signature-rule{margin:12px 0;padding:10px 12px;border-left:4px solid var(--red);background:#fff1f0;color:var(--red);font-size:12px;font-weight:700;line-height:1.45}
.education-box{margin:12px 0;padding:10px 12px;border-left:4px solid #2878c8;background:#eef6ff;color:#214f7c;font-size:12px;line-height:1.55}
.doc-options label{justify-content:flex-start!important}
.doc-options label>span:first-of-type{flex:1}
.doc-status{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:3px 8px;border-radius:999px}
.doc-status.mandatory{color:#136b3a;background:#e5f7ed;border:1px solid #a8dfbf}
.doc-status.optional{color:#a15700;background:#fff0dc;border:1px solid #f2c98f}
.version-options label{justify-content:flex-start;text-align:left;align-items:flex-start}
.version-options span{display:flex;flex-direction:column;gap:3px}
.version-options small{font-size:11px;color:var(--muted);font-weight:500;line-height:1.35}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-full{width:100%}

.gen-box{background:linear-gradient(145deg,#f8f5fd,#f2f8f5);border:1px solid #cdbde1;border-radius:16px;padding:20px;text-align:center;box-shadow:var(--shadow)}
.gen-box h3{font-size:16px;color:var(--pe);margin-bottom:6px}
.gen-box p{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.5}
.doc-group{border:1px solid var(--bdr);border-radius:12px;padding:14px;margin-bottom:11px;background:#fff;text-align:left}
.doc-group h4{font-size:14px;color:var(--txt);margin-bottom:9px}
.doc-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.upload-box{border:1.5px dashed #c6b7e2;border-radius:12px;padding:14px;background:#fcfbff}
.upload-box input[type="file"]{padding:8px;background:#fff;border:1.5px solid var(--bdr);border-radius:8px}
.prefill-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prefill-card{border:1px solid var(--bdr);border-radius:12px;padding:12px;background:#fff}
.prefill-card h4{font-size:13px;margin-bottom:8px;color:var(--txt)}
.prefill-meta{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}
.prefill-snippet{margin-top:6px;padding:8px;border-radius:8px;background:#f7f7fb;font-size:11.5px;color:#47465a;line-height:1.45}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.25px}
.pill.ok{background:#e6f7ed;color:#16653d}
.pill.warn{background:#fff2d9;color:#8a5b00}
.pill.muted{background:#f0f0f5;color:#5b5a6d}

.rtbl{width:100%;border-collapse:collapse;font-size:13px}
.rtbl td{padding:7px 8px;border-bottom:1px solid var(--bdr);vertical-align:top}
.rtbl td:first-child{font-weight:600;color:var(--muted);width:42%}
.rtbl tr.hd td{background:var(--pe);color:#fff;font-weight:700;font-size:11.5px;letter-spacing:.4px}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--txt);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center;z-index:999}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:var(--green)}
#toast.er{background:var(--red)}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.preview-modal{position:fixed;inset:0;background:rgba(15,10,25,.72);z-index:200;display:none;align-items:stretch;justify-content:center;padding:18px}
.preview-modal.open{display:flex}
.preview-shell{width:min(1120px,100%);background:#e8e8ed;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 28px 80px rgba(0,0,0,.38)}
.preview-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-bottom:1px solid #d6d6df}
.preview-head h2{font-size:15px;margin-right:auto}
.preview-note{font-size:11px;color:var(--muted)}
.preview-body{flex:1;overflow:auto;padding:18px;-webkit-overflow-scrolling:touch}
.preview-body .docx-wrapper{background:transparent!important;padding:0!important}
.preview-body section.docx{margin:0 auto 18px!important;box-shadow:0 5px 22px rgba(0,0,0,.14)!important}
.preview-loading{display:grid;place-items:center;min-height:50vh;color:var(--muted);font-weight:650}
.pdf-export{position:fixed;left:-100000px;top:0;width:210mm;background:#fff}
.pdf-export section.docx{width:210mm!important;min-height:297mm!important;margin:0!important;box-shadow:none!important;break-after:page;page-break-after:always}
.pdf-export section.docx:last-child{break-after:auto;page-break-after:auto}
.pdf-export-root{position:fixed;left:-100000px;top:0;width:210mm;background:#fff;overflow:visible;z-index:-1}
.pdf-export-root section.docx{position:relative!important;top:0!important;left:0!important;width:210mm!important;min-height:297mm!important;margin:0!important;transform:none!important;box-shadow:none!important;background:#fff!important}
@media(max-width:600px){.app-header{padding:11px 12px}.wrap{padding:15px 10px 82px}.saved{display:none}.cbd{padding:14px}.act{position:sticky;bottom:0;background:rgba(243,244,248,.95);padding:10px 0;z-index:20}.act>.btn{flex:1}.reset-actions{width:100%}.reset-actions .btn{flex:1}.doc-btns{display:grid;grid-template-columns:1fr 1fr}.doc-btns .btn{width:100%;padding:10px 8px}.preview-modal{padding:0}.preview-shell{border-radius:0}.preview-head{flex-wrap:wrap}.preview-note{width:100%;order:3}.preview-body{padding:8px}.preview-body section.docx{transform-origin:top left}}
@media print{body>*:not(#previewModal){display:none!important}#previewModal{position:static!important;display:block!important;background:#fff!important;padding:0!important}#previewModal .preview-shell{display:block!important;width:auto!important;box-shadow:none!important;border-radius:0!important;background:#fff!important}.preview-head{display:none!important}.preview-body{overflow:visible!important;padding:0!important}.preview-body .docx-wrapper{padding:0!important}.preview-body section.docx{box-shadow:none!important;margin:0 auto!important}}
</style>
</head>
<body>
<header class="app-header">
  <div class="logo">DG</div>
  <div>
    <h1>Onboarding Document Generator</h1>
    <p>Fill once &middot; Generate all documents &middot; Sign &amp; submit</p>
  </div>
  <div class="saved" id="saveLabel">Auto-save ON</div>
</header>
<div class="wrap">
  <div class="progress" id="progressBar"></div>
  <div id="app"></div>
</div>
<div id="toast"></div>
<div class="preview-modal" id="previewModal" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
  <div class="preview-shell">
    <div class="preview-head">
      <h2 id="previewTitle">Word document preview</h2>
      <button class="btn btn-p" id="previewDownload" type="button">Download .docx</button>
      <button class="btn btn-g" id="previewPdf" type="button">Download PDF</button>
      <button class="btn btn-s" id="previewPrint" type="button">Print</button>
      <button class="btn btn-s" id="previewClose" type="button">Close</button>
      <div class="preview-note">Approximate Word preview. Final page breaks can vary slightly in Microsoft Word.</div>
    </div>
    <div class="preview-body" id="previewBody"><div class="preview-loading">Preparing preview…</div></div>
  </div>
</div>
<script type="module" src="./app.js?v=11"></script>
</body>
</html>
